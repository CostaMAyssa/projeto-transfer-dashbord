version: "3.7"

services:
  aztransfer-dashboard-website:
    image: node:20-alpine
    container_name: aztransfer-dashboard-website
    restart: always
    working_dir: /app
    volumes:
      - /root/site-aztransfer-dashboard:/app
    environment:
      - NODE_ENV=production
    command: sh -c "npm install && npm run build && npm run start"
    networks:
      - groupnet
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - traefik.enable=true
        - traefik.http.routers.aztransfer-dashboard-website.rule=Host(`dashboard.aztransfergroup.com`)
        - traefik.http.routers.aztransfer-dashboard-website.entrypoints=websecure
        - traefik.http.routers.aztransfer-dashboard-website.tls.certresolver=letsencryptresolver
        - traefik.http.services.aztransfer-dashboard-website.loadbalancer.server.port=3000

networks:
  groupnet:
    external: true